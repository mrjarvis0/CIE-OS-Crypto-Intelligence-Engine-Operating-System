[pytest]
# The suite is written with bare `async def test_*` functions and no
# @pytest.mark.asyncio decorators, so pytest-asyncio must run in auto mode.
# Without this, every async test is collected, skipped as "not natively
# supported", and reported as a failure rather than actually executing.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths =
    blockchain
    chains
    cli
    config
    contracts
    core
    database
    decision
    evaluation
    fixtures
    ingestion
    intelligence
    interfaces
    knowledge
    memory
    normalization
    planning
    prompts
    schemas
    sensors
    skills
    pipeline
    telemetry
    tests
    tiers
    tools

python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    default
