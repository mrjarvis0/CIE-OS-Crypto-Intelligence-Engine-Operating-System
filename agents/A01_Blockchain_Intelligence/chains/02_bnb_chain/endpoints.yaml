# BNB Smart Chain endpoints
# API keys go in .env.local at the agent root — never in source.

chain: bnb_chain
chain_id: 56
protocol: evm_json_rpc

providers:
  # --- keyed (free tier) ---

  - name: quicknode
    access: keyed_free
    env_var: QUICKNODE_URL
    # Get at: quicknode.com
    archive: true
    logs: true
    rate_limit: 300/min

  - name: drpc
    access: keyed_free
    env_var: DRPC_API_KEY
    # Get at: drpc.org
    archive: true
    logs: true
    rate_limit: 300/min

  - name: blockpi
    access: keyed_free
    env_var: BLOCKPI_API_KEY
    # Get at: blockpi.io
    archive: true
    logs: true
    rate_limit: 300/min

  # --- open ---

  - name: binance-dataseed
    access: open
    archive: false
    logs: true
    rate_limit: 120/min

  - name: binance-dataseed-1
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: defibit
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: ninicoin
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: publicnode
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: ankr-public
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: 1rpc
    access: open
    archive: false
    logs: false
    rate_limit: 60/min

  - name: drpc-public
    access: open
    archive: false
    logs: true
    rate_limit: 60/min
