# Scroll endpoints
# No keyed providers catalogued for this chain.
# API keys go in .env.local at the agent root — never in source.

chain: scroll
chain_id: 534352
protocol: evm_json_rpc

providers:
  # --- open only (no keyed provider available) ---

  - name: scroll-official
    access: open
    archive: false
    logs: true
    rate_limit: 120/min

  - name: publicnode
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: 1rpc
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: drpc-public
    access: open
    archive: false
    logs: true
    rate_limit: 60/min
