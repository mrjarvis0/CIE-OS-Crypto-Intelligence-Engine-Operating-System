# Mantle endpoints
# No keyed providers catalogued for this chain.
# API keys go in .env.local at the agent root — never in source.

chain: mantle
chain_id: 5000
protocol: evm_json_rpc

providers:
  # --- open only (no keyed provider available) ---

  - name: mantle-official
    access: open
    archive: false
    logs: true
    rate_limit: 120/min

  - name: publicnode
    access: open
    archive: false
    logs: true
    rate_limit: 60/min

  - name: 1rpc
    access: open
    archive: false
    logs: true
    rate_limit: 60/min
